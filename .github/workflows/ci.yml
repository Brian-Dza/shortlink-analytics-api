name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-migrate-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shortlink_ci
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: shortlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shortlink_ci -d shortlink_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://shortlink_ci:ci_test_password@localhost:5432/shortlink_test
      TEST_DATABASE_URL: postgresql+asyncpg://shortlink_ci:ci_test_password@localhost:5432/shortlink_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
      JWT_SECRET_KEY: ci-only-jwt-secret-key-at-least-32-characters
      IP_HASH_SALT: ci-only-ip-hash-salt-16

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff lint and format checks
        run: |
          ruff check app tests alembic
          ruff format --check app tests alembic

      - name: Verify reversible Alembic migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run Pytest suite against PostgreSQL 16 and Redis 7
        run: pytest -v
